<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Get Done">
  <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
  <title>Get Done</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <span class="brand" id="brand">Get Done</span>
        <button type="button" class="icon-button" id="auth-menu" title="Security" hidden></button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-section">
        <span>Projects</span>
        <button type="button" class="icon-button" id="add-project" title="New project"></button>
      </div>
      <div class="project-tree" id="project-tree"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main" id="main">
      <header class="main-header">
        <button type="button" class="icon-button menu-toggle" id="menu-toggle" title="Menu" aria-label="Open the menu"></button>
        <h1 class="view-title" id="view-title">Inbox</h1>
        <div class="header-actions">
          <button type="button" class="button header-button" id="sort-button" title="Sort"><span id="sort-label">Manual order</span></button>
          <button type="button" class="button header-button" id="add-section" title="New section" hidden><span class="label">Section</span></button>
          <button type="button" class="icon-button" id="delete-project" title="Delete project" hidden></button>
          <button type="button" class="icon-button" id="more-button" title="More"></button>
        </div>
      </header>
      <div class="week-strip" id="week-strip" hidden></div>
      <div class="tasks" id="tasks"></div>
    </main>
  </div>

  <button type="button" class="fab" id="fab" title="Add task" aria-label="Add task"></button>

  <footer class="statusbar">
    <div class="status-left">
      <span class="status-mode normal" id="status-mode">-- NORMAL --</span>
      <span class="status-position" id="status-position">0 / 0</span>
    </div>
    <div class="status-hints">
      <span><kbd>j</kbd><kbd>k</kbd> move</span>
      <span><kbd>a</kbd> add</span>
      <span><kbd>d</kbd> done</span>
      <span><kbd>Space</kbd> select</span>
      <span><kbd>m</kbd> move to</span>
      <span><kbd>/</kbd> search</span>
      <button type="button" class="status-help" id="status-help"><kbd>?</kbd> help</button>
    </div>
  </footer>
</body>
</html>
